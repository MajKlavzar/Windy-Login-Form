<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset – Account – Windy.com</title>
    <link rel="stylesheet" href="Styles/style.css">
    <link rel="icon" type="image/x-icon" href="Images/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="Scripts/submit.js" defer></script>
</head>

<body>
    <main>
        <div class="main-top">
            <img class="logo" src="Images/logo.png" width="60" height="60">
            <img class="logo" src="Images/logo-text-windycom-white.svg" height="45">
        </div>
        <section class="form-container">
            <form id="password-reset-form" novalidate aria-live="polite">
                <div class="inputField">
                    <label for="email" class="input-title>Email</label>
                    <p id="reset-mail-text">Enter the email address you used to sign up.</p>
                    <input type="email" id="email" name="email" required autofocus>
                </div>
                <button type="submit" id="submit">Send Reset Link</button>
            </form>
        </section>
        <footer>
            <a href="https://account.windy.com/agreements/windy-privacy-policy" class="footer-link">Privacy policy</a>
            <a href="https://account.windy.com/agreements/overview-of-all-terms-of-use" class="footer-link">Terms of use</a>
            <a href="https://account.windy.com/faq" class="footer-link">FAQ</a>
            <button id="settings-button"><img src="Images/cog.svg" alt="Settings"></button>
        </footer>
    </main>
</body>
</html>
